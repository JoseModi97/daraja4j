name: Release Gradle Plugin

# Publishes daraja4j-gradle-plugin to the Gradle Plugin Portal
# (plugins.gradle.org). It does not trigger on tag pushes by itself:
# release.yml calls it on a `vX.Y.Z` tag, only after the full CI suite
# passes and the Maven Central upload succeeds, so both releases go out
# together and never for a commit that fails CI. It can also be run
# manually (e.g. to retry a failed plugin publish), in which case it runs
# the CI suite itself first.
#
# Requires these repository secrets before this workflow can run for real
# (see PLAN.md "Publishing the Gradle plugin" for how to obtain them):
#   GRADLE_PUBLISH_KEY, GRADLE_PUBLISH_SECRET - Plugin Portal API key pair
#   (Profile -> API Keys at https://plugins.gradle.org, after creating an
#   account and running the one-time website/CLI key-generation flow)

on:
  workflow_call:
    inputs:
      version:
        description: "Version to publish. Defaults to the reactor's pom.xml version (which release.yml has already checked matches the tag)."
        type: string
        required: false
        default: ""
      skip_ci:
        description: "Set by release.yml, which has already run the CI suite."
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0) - must already be a released version (matching Maven Central artifacts)."
        required: true

jobs:
  ci:
    name: CI
    if: ${{ !inputs.skip_ci }}
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to the Gradle Plugin Portal
    needs: ci
    # Runs when CI passed, or when CI was skipped because release.yml
    # already ran it; never when CI failed or was cancelled.
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install the main reactor to the local Maven repo
        # daraja4j-gradle-plugin is a standalone build (see PLAN.md SS5);
        # its own build/test needs daraja4j-core et al. resolvable from
        # mavenLocal, same as the CI job in ci.yml.
        run: mvn -B -DskipTests install

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract version
        id: version
        # An explicit input (manual run) wins; otherwise use the reactor's
        # pom.xml version, which release.yml has already checked against
        # the pushed tag.
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test at the tagged version
        working-directory: daraja4j-gradle-plugin
        run: ./gradlew build -PdarajaVersion=${{ steps.version.outputs.version }} --console=plain

      - name: Publish to the Gradle Plugin Portal
        working-directory: daraja4j-gradle-plugin
        # com.gradle.plugin-publish's publishPlugins task reads these two
        # names directly via System.getenv() - it does NOT consult Gradle
        # project properties, so the ORG_GRADLE_PROJECT_<name> env-var
        # convention (which only populates project properties) doesn't
        # reach it. Plain env var names are what the task actually checks.
        run: ./gradlew publishPlugins -PdarajaVersion=${{ steps.version.outputs.version }} --console=plain
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
