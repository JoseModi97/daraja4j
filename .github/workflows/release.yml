name: Release

# Template workflow: when a `vX.Y.Z` tag is pushed, runs the full CI suite
# (ci.yml) and, only if every CI job passes, publishes every module in the
# reactor (daraja4j-core, -servlet, -jakarta, both Spring Boot starters,
# -cli, -bom, -maven-plugin) to Maven Central via the Sonatype Central
# Publishing Portal, then publishes the standalone daraja4j-gradle-plugin
# build to the Gradle Plugin Portal (release-gradle-plugin.yml).
#
# Requires these repository secrets before this workflow can run for real
# (see PLAN.md "Publishing to Maven Central" for how to obtain each one):
#   CENTRAL_USERNAME, CENTRAL_PASSWORD   - Sonatype Central Publishing Portal user token
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE      - artifact signing key (Central requires signed releases)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build, sign, and run everything up to (but not including) the actual upload to Central."
        type: boolean
        default: true

jobs:
  ci:
    name: CI
    # Runs the full CI suite (including the Java 8 and multi-release-jar
    # smoke tests, which `mvn verify` below does not cover) against the
    # tagged commit. Nothing is published unless every CI job passes.
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to Maven Central
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Verify tag matches the reactor's project version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match pom.xml version $POM_VERSION" >&2
            exit 1
          fi

      - name: Run the full test suite before publishing anything
        run: mvn -B verify

      - name: "Dry run: build and sign every module (stops before the deploy phase, so nothing is uploaded to Central)"
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: mvn -B -Prelease -DskipTests verify
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build, sign, and publish every module
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: mvn -B -Prelease -DskipTests deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  publish-gradle-plugin:
    name: Publish to the Gradle Plugin Portal
    # Only after CI passes AND the Maven Central upload succeeds, so the
    # plugin never goes out for a version whose library release failed.
    # Skipped on dry runs.
    needs: [ci, publish]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    uses: ./.github/workflows/release-gradle-plugin.yml
    with:
      skip_ci: true # the ci job above already gated this run
    secrets: inherit
